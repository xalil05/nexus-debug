# =============================================================================
# Nexus-Debug — docker-compose
# =============================================================================
version: "3.9"

services:
  nexus:
    build: .
    container_name: nexus-debug
    ports:
      - "9001:9001"
    volumes:
      - nexus_kb:/data/nexus/kb
      - nexus_reports:/data/nexus/reports
      - nexus_feedback:/data/nexus/feedback
      - nexus_db:/data/nexus
    env_file:
      - .env
    environment:
      - NEXUS_API_HOST=0.0.0.0
      - NEXUS_API_PORT=9001
      - TZ=UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:9001/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - nexus_monitoring
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "512M"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: nexus-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - nexus_prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped
    networks:
      - nexus_monitoring

  grafana:
    image: grafana/grafana:11.1.0
    container_name: nexus-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - nexus_grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-CHANGE_ME}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - nexus_monitoring

networks:
  nexus_monitoring:
    driver: bridge

volumes:
  nexus_kb:
  nexus_reports:
  nexus_feedback:
  nexus_db:
  nexus_prometheus:
  nexus_grafana:

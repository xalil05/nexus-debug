[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-debug"
version = "2.1.0"
description = "🧬 Système agentique de débogage (ReAct + LangGraph + DeepSeek V4 Pro)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "AMICO TECH / Ibrahima Xaliloulah NDIAYE"},
]
keywords = ["debug", "agentic", "react", "langgraph", "deepseek", "bug-fixing"]

dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "loguru>=0.7.0",
    "aiosqlite>=0.19.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "httpx>=0.24.0",
    "ruff>=0.3.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
lint = [
    "ruff>=0.3.0",
    "mypy>=1.0",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "httpx>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_*", "orchestrateur_integration"]
exclude = ["tests*", ".venv*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ARG", "C4", "T20"]

[tool.mypy]
strict = false
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["nexus"]
omit = ["tests/*", "*.venv/*"]

# =============================================================================
# Nexus-Debug — Prometheus Scrape Config
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "nexus-debug"
    static_configs:
      - targets: ["nexus:9001"]
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

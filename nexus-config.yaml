# =============================================================================
# Nexus-Debug — Configuration YAML unique (nexus-config.yaml)
# =============================================================================
# Remplacer les variables d'env par un fichier unique.
# Priorité : YAML > env vars > defaults
# =============================================================================

# ── LLM Provider ─────────────────────────────────────────────────────────────
llm:
  provider: deepseek          # deepseek | openai | openrouter | anthropic
  model: deepseek-v4-pro        # ou gpt-4o, claude-sonnet-4-20250514, etc.
  api_keys:
    deepseek: ""              # Clé DeepSeek
    openai: ""                # Clé OpenAI
    openrouter: ""            # Clé OpenRouter
    anthropic: ""             # Clé Anthropic

# ── API ──────────────────────────────────────────────────────────────────────
api:
  host: "0.0.0.0"
  port: 9001
  key: "CHANGE_ME"            # NEXUS_API_KEY — obligatoire
  cors_origin: "http://localhost:9001"
  rate_limit: "10/minute"

# ── Persistence ──────────────────────────────────────────────────────────────
storage:
  db_path: "/data/nexus/nexus.db"
  kb_path: "/data/nexus/kb/nexus_kb.yaml"
  reports_dir: "/data/nexus/reports"
  feedback_path: "/data/nexus/feedback/nexus_feedback.yaml"

# ── Codebase ─────────────────────────────────────────────────────────────────
codebase:
  path: "/app/workspace"
  max_brief_length: 5000

# ── Webhooks / Notifications ─────────────────────────────────────────────────
notifications:
  github_webhook_secret: ""
  github_token: ""
  slack_webhook_url: ""

# ── Capture (nexus-capture) ──────────────────────────────────────────────────
capture:
  url: "http://nexus-debug:9001"
  enabled: true
  project: "unknown"
  version: "0.0.0"
  capture_4xx: false
  max_breadcrumbs: 50

# ── Agent ────────────────────────────────────────────────────────────────────
agent:
  temperature: 0.1
  max_tokens: 4096
  max_retries: 3
  interactive: false          # Mode interactif (Phase 3)

# ── Monitoring ───────────────────────────────────────────────────────────────
monitoring:
  prometheus_enabled: true
  grafana_password: "CHANGE_ME"

# ── Version ──────────────────────────────────────────────────────────────────
version: "3.0.0"
